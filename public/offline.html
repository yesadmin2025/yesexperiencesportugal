<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — YES Experiences Portugal</title>
    <style>
      :root {
        --ivory: #faf8f3;
        --charcoal: #2e2e2e;
        --teal: #295b61;
        --gold: #c9a96a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ivory);
        color: var(--charcoal);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.5rem;
        max-width: 34rem;
        margin: 0 auto;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--teal);
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: 1.9rem;
        line-height: 1.2;
        margin: 0.9rem 0 0;
      }
      p {
        line-height: 1.6;
        color: #4a4a4a;
      }
      a {
        display: inline-block;
        margin-top: 1.4rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        background: var(--teal);
        color: var(--ivory);
        text-decoration: none;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">YES Experiences Portugal</span>
      <h1>You are offline</h1>
      <p>
        Your day is designed live with real availability, so it needs a connection. Reconnect and
        we will pick up exactly where you left off.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
