name: Living Atlas operational status formatting

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-format-operational-status.yml"

permissions:
  contents: write

jobs:
  format-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format exact operational files
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasOperationalConfidence.tsx
          src/components/studio-v3/livingAtlasOperationalConfidence.ts

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-*.test.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.tsx

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Guard exact changed path
        run: |
          test "$(git diff --name-only)" = "src/components/studio-v3/livingAtlasOperationalConfidence.ts"

      - name: Commit validated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3/livingAtlasOperationalConfidence.ts
          git commit -m "style(studio): format operational status layer"
          git push origin HEAD:studio/living-atlas
