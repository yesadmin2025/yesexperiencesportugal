name: Import reviewed mobile hero snapshot once
on:
  push:
    branches: [fix/mobile-cinematic-rhythm-20261126]
    paths: ['.github/workflows/import-reviewed-mobile-hero-once.yml']
permissions:
  actions: read
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15085559505'
          run-id: '45751929654'
          github-token: ${{ github.token }}
          path: /tmp/reviewed
      - name: Verify the exact reviewed PNG and create immutable blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t matches < <(find /tmp/reviewed -type f -name 'hero-stanza-mobile-chromium-actual.png')
          test "${#matches[@]}" -eq 1
          f="${matches[0]}"
          echo "17ad1690cd1c5de925ddc8217fc8bb39f6223795645718b540926426148a5227  $f" | sha256sum -c -
          sha=$(base64 -w0 "$f" | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$GH_REPO/git/blobs" --method POST --input - --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "REVIEWED_MOBILE_HERO_BLOB $sha"
