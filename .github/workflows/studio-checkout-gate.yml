name: studio-checkout-gate

# Required check: itinerary curation stability, Signature section contract,
# Studio V3 reveal section order, and checkout inclusions must all pass on
# every push and pull request. These lock the four regressions the user
# reported (Arrábida-wine jump, messy signatures, mixed reveal, wrong
# checkout inclusions).

on:
  push:
  pull_request:

concurrency:
  group: studio-checkout-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: studio + checkout suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run gated vitest suites
        run: |
          bunx vitest run \
            src/components/studio-v3/__tests__/itinerary-edit-stability.test.ts \
            src/__tests__/signature-section-contract.test.ts \
            src/components/studio-v3/__tests__/reveal-section-order.test.ts \
            src/lib/checkout/__tests__/inclusions.test.ts