name: checkout-recovery-patch

on:
  push:
    branches:
      - checkout-confirmation-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkout-confirmation-recovery
          fetch-depth: 0
      - name: Patch checkout recovery
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/studio-v3/StudioV3.tsx")
          source = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)console\.error\("Stripe checkout failed", e\);\n'
              r'(?P=indent)toast\.error\("Checkout unavailable right now\. We\x27ve opened a private enquiry instead\."\);\n'
              r'(?P=indent)setClientSecret\(null\);\n'
              r'(?P=indent)openLeadSheet\("book"\);$'
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"Expected checkout failure block exactly once, found {len(matches)}")
          indent = matches[0].group("indent")
          replacement = (
              f'{indent}console.error("Stripe checkout failed", e);\n'
              f'{indent}toast.error("Secure checkout couldn\x27t open. Your details and selections are still here — try again.");\n'
              f'{indent}setClientSecret(null);'
          )
          path.write_text(pattern.sub(replacement, source, count=1))
      - name: Verify patch contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Secure checkout couldn't open. Your details and selections are still here — try again." src/components/studio-v3/StudioV3.tsx
          ! grep -F "Checkout unavailable right now. We've opened a private enquiry instead." src/components/studio-v3/StudioV3.tsx
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3/StudioV3.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep checkout state available for retry"
          git push origin HEAD:checkout-confirmation-recovery
