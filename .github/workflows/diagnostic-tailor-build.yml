name: Diagnostic Tailor build

on:
  push:
    branches:
      - fix/tailor-price-map-ci-20261002

jobs:
  build:
    name: bun run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
