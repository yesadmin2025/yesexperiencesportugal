name: Production gate

# One composite gate that must pass before production is trusted:
# build + typecheck + critical unit tests + prebuild route/meta/sitemap checks
# + mobile / Studio / Stripe-test / confirmation smoke against the built app.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Automated runs must never touch Stripe live mode.
      VITE_PAYMENTS_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Prebuild checks (routes, metadata, sitemap, brand, contrast)
        run: bun run prebuild

      - name: Critical unit tests
        run: bunx vitest run

      - name: Production build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # The complete browser matrix is retained in its dedicated CI workflows.
      # This protected gate tests actual navigation + checkout paths rather
      # than timing out after running hundreds of unrelated E2E assertions.
      - name: Smoke — mobile, Studio, checkout (test mode), confirmation
        # A dedicated CI Supabase test project is required for server-only
        # price policies; NEVER use a production service-role key on PR code.
        env:
          SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo '::error::Configure CI_SUPABASE_URL and CI_SUPABASE_SERVICE_ROLE_KEY for a test-only Supabase project. No production credentials or price fallbacks are permitted.'
            exit 1
          fi
          bunx playwright test \
            e2e/homepage-smart-start.spec.ts \
            e2e/studio-canonical-routing.spec.ts \
            e2e/living-atlas-production.spec.ts \
            e2e/checkout-mobile-friction.spec.ts \
            --project=mobile-chromium
          bunx playwright test \
            e2e/studio-canonical-routing.spec.ts \
            e2e/living-atlas-production.spec.ts \
            --project=desktop-chromium

      - name: Upload checkout/browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          include-hidden-files: true
