name: Temporary Tailor autoformat

on:
  push:
    branches:
      - fix/tailor-price-map-ci-20261002

permissions:
  contents: write

jobs:
  format:
    name: Prettier Tailor files
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tailor-price-map-ci-20261002
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed Tailor files
        run: >
          bunx prettier --write
          'src/routes/tours_.$tourId.tailor.tsx'
          src/hooks/use-tailor-price-map.ts
          src/components/admin/TailorPriceMap.tsx
          src/lib/tailor/tailor-price-catalog.ts
          src/lib/tailor/tailor-price-engine.ts
          src/data/tailorRules.ts
          supabase/functions/_shared/pricing.ts
          supabase/functions/_shared/tailor-price-engine.ts
          supabase/functions/create-signature-checkout/index.ts
          src/__tests__/tailor-pass1b-correction.test.ts
          src/__tests__/tailor-rules.test.ts
          src/lib/tailor/__tests__/tailor-price-engine.test.ts
          src/lib/studio-v3/__tests__/winery-tradeoff-and-price-parity.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/tours_.$tourId.tailor.tsx' src/hooks/use-tailor-price-map.ts src/components/admin/TailorPriceMap.tsx src/lib/tailor/tailor-price-catalog.ts src/lib/tailor/tailor-price-engine.ts src/data/tailorRules.ts supabase/functions/_shared/pricing.ts supabase/functions/_shared/tailor-price-engine.ts supabase/functions/create-signature-checkout/index.ts src/__tests__/tailor-pass1b-correction.test.ts src/__tests__/tailor-rules.test.ts src/lib/tailor/__tests__/tailor-price-engine.test.ts src/lib/studio-v3/__tests__/winery-tradeoff-and-price-parity.test.ts
          git commit -m "Format Tailor pricing changes"
          git push
