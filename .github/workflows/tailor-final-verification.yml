name: Tailor final verification

on:
  push:
    branches:
      - fix/tailor-price-map-ci-20261002

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Tailor targeted tests
        run: |
          bunx vitest run \
            src/lib/tailor/__tests__/tailor-price-engine.test.ts \
            src/lib/studio-v3/__tests__/winery-tradeoff-and-price-parity.test.ts \
            src/__tests__/tailor-pass1b-correction.test.ts \
            src/__tests__/tailor-rules.test.ts \
            src/data/__tests__/exact-tier-parity.test.ts \
            --reporter=dot
      - name: Build
        run: bun run build
