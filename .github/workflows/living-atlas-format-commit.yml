name: Living Atlas validated format commit

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-format-commit.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format exact files
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasPreviewPrimitives.tsx
          src/components/studio-v3/LivingAtlasResultStep.tsx
          src/components/studio-v3/LivingAtlasShapeStep.tsx
          src/components/studio-v3/livingAtlasAlternatives.ts
          src/components/studio-v3/livingAtlasPreviewState.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts

      - name: Validate Living Atlas
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Validate TypeScript
        run: bunx tsc --noEmit

      - name: Guard exact changed paths
        run: |
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          src/components/studio-v3/LivingAtlasPreviewPrimitives.tsx
          src/components/studio-v3/LivingAtlasResultStep.tsx
          src/components/studio-v3/LivingAtlasShapeStep.tsx
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/livingAtlasAlternatives.ts
          src/components/studio-v3/livingAtlasPreviewState.ts
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit exact validated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/studio-v3/LivingAtlasPreviewPrimitives.tsx \
            src/components/studio-v3/LivingAtlasResultStep.tsx \
            src/components/studio-v3/LivingAtlasShapeStep.tsx \
            src/components/studio-v3/livingAtlasAlternatives.ts \
            src/components/studio-v3/livingAtlasPreviewState.ts \
            src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          git commit -m "style(studio): apply validated Living Atlas formatting"
          git push origin HEAD:studio/living-atlas
