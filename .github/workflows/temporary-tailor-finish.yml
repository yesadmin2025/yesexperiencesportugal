name: Temporary Tailor finish

on:
  push:
    branches:
      - fix/tailor-price-map-ci-20261002

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tailor-price-map-ci-20261002
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Tailor files only
        run: |
          bunx prettier --write \
            'src/routes/tours_.$tourId.tailor.tsx' \
            src/hooks/use-tailor-price-map.ts \
            src/components/admin/TailorPriceMap.tsx \
            src/routes/admin.price-map.tsx \
            src/data/tailorRules.ts \
            src/lib/tailor/tailor-price-catalog.ts \
            src/lib/tailor/tailor-price-engine.ts \
            supabase/functions/_shared/tailor-price-engine.ts \
            supabase/functions/_shared/pricing.ts \
            supabase/functions/create-signature-checkout/index.ts \
            src/lib/tailor/__tests__/tailor-price-engine.test.ts \
            src/lib/studio-v3/__tests__/winery-tradeoff-and-price-parity.test.ts \
            src/__tests__/tailor-pass1b-correction.test.ts \
            src/__tests__/tailor-rules.test.ts \
            src/data/__tests__/exact-tier-parity.test.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Format Tailor pricing implementation"
            git push
          fi
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Tailor regression tests
        run: |
          bunx vitest run \
            src/lib/tailor/__tests__/tailor-price-engine.test.ts \
            src/lib/studio-v3/__tests__/winery-tradeoff-and-price-parity.test.ts \
            src/__tests__/tailor-pass1b-correction.test.ts \
            src/__tests__/tailor-rules.test.ts \
            src/data/__tests__/exact-tier-parity.test.ts \
            --reporter=dot
      - name: Build
        run: bun run build
