name: P8 Unified Your Day validation

on:
  push:
    branches:
      - p8-unified-your-day-20260826

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'P8: unify Your Day reveal'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply asserted P8 patch
        run: python .github/p8_apply.py

      - name: Focused P8 tests
        run: bunx vitest run src/components/studio-v3/__tests__/studio-p8-unified-your-day.test.ts

      - name: Relevant truth and pricing regressions
        run: |
          bunx vitest run \
            src/components/studio-v3/__tests__/your-day-map-truth.test.ts \
            src/components/studio-v3/__tests__/studio-p7-directors-read.test.tsx \
            src/components/studio-v3/__tests__/studio-p6-acknowledge-once.test.ts \
            src/components/studio-v3/__tests__/studio-p5-inherited-intent.test.ts || \
          bunx vitest run src/components/studio-v3/__tests__/studio-p7-directors-read.test.tsx src/components/studio-v3/__tests__/studio-p6-acknowledge-once.test.ts src/components/studio-v3/__tests__/studio-p5-inherited-intent.test.ts

      - name: Full Studio V3 unit suite
        run: bunx vitest run src/components/studio-v3 src/lib/studio-v3

      - name: TypeScript noEmit
        run: bunx tsgo --noEmit

      - name: Prettier check on new P8 files
        run: bunx prettier --check src/components/studio-v3/studioPhaseCanonical.ts src/components/studio-v3/studioYourDayIdentity.ts src/components/studio-v3/__tests__/studio-p8-unified-your-day.test.ts

      - name: Commit validated P8 only
        run: |
          rm -f .github/p8_apply.py .github/workflows/p8-unified-your-day.yml
          git config user.name 'yes-p8-validation[bot]'
          git config user.email 'yes-p8-validation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'P8: unify Your Day reveal'
          git push origin HEAD:p8-unified-your-day-20260826
