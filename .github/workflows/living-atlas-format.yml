name: Living Atlas format

on:
  push:
    branches:
      - studio/living-atlas
    paths:
      - "src/components/studio-v3/LivingAtlasPreview.tsx"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - ".github/workflows/living-atlas-format.yml"

permissions:
  contents: write

concurrency:
  group: living-atlas-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Prettier and commit Living Atlas files
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Living Atlas files
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasPreview.tsx
          src/components/studio-v3/livingAtlas*.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.tsx
          src/routes/studio-living-atlas-preview.tsx

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Living Atlas files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/studio-v3/LivingAtlasPreview.tsx \
            src/components/studio-v3/livingAtlas*.ts \
            src/components/studio-v3/__tests__/living-atlas-*.test.ts \
            src/components/studio-v3/__tests__/living-atlas-*.test.tsx \
            src/routes/studio-living-atlas-preview.tsx
          git commit -m "style(studio): format Living Atlas files"
          git push origin HEAD:studio/living-atlas
