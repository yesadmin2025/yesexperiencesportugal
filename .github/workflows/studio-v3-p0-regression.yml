name: studio-v3-p0-regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: studio-v3-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-v3-p0:
    name: Living Atlas P0 regression (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-chromium
          - desktop-chromium
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Living Atlas production journey
        run: >-
          bunx playwright test
          e2e/living-atlas-production.spec.ts
          --project=${{ matrix.project }}

      - name: Upload failed diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-p0-${{ matrix.project }}-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
