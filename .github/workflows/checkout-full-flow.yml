name: checkout-full-flow

# Full end-to-end flow: real Stripe sandbox payment + branded
# /booking-confirmed assertion for Signature, Tailored, and Builder.
#
# Runs on manual dispatch only — it hits Stripe sandbox and a public
# Lovable-hosted return URL, so it's slower and noisier than the
# always-on checkout-surfaces-smoke gate.

on:
  workflow_dispatch:
    inputs:
      confirmed_origin:
        description: "Public https origin used as Stripe return URL"
        required: false
        default: "https://yesexperiencesportugal.lovable.app"

jobs:
  full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run full-flow E2E
        env:
          STRIPE_E2E: "1"
          PLAYWRIGHT_CONFIRMED_ORIGIN: ${{ inputs.confirmed_origin }}
        run: bunx playwright test e2e/checkout-full-flow.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-flow-playwright-report
          path: playwright-report
          retention-days: 7
