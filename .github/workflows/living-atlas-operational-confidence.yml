name: Living Atlas operational confidence

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-operational-confidence.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact UI patch
        run: node scripts/apply-living-atlas-operational-confidence.mjs

      - name: Format Living Atlas operational layer
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasShapeStep.tsx
          src/components/studio-v3/LivingAtlasOperationalConfidence.tsx
          src/components/studio-v3/livingAtlasOperationalConfidence.ts
          src/components/studio-v3/__tests__/living-atlas-operational-confidence.test.ts

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/__tests__/living-atlas-route-planner.test.ts
          src/components/studio-v3/__tests__/living-atlas-operational-confidence.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Guard exact changed path
        run: |
          test "$(git diff --name-only)" = "src/components/studio-v3/LivingAtlasShapeStep.tsx"

      - name: Commit validated UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3/LivingAtlasShapeStep.tsx
          git commit -m "feat(studio): integrate operational confidence into the itinerary"
          git push origin HEAD:studio/living-atlas
