name: Living Atlas route format artifact

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-route-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format private preview route
        run: bunx prettier --write src/routes/studio-living-atlas-preview.tsx

      - name: Upload exact route
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-formatted-route
          path: src/routes/studio-living-atlas-preview.tsx
          if-no-files-found: error
          retention-days: 1
