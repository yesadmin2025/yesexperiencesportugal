name: External health check

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe revenue-critical URLs
        run: node scripts/health-check.mjs https://yesexperiencesportugal.com
