name: One-time Stripe dynamic payment hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-dynamic-payment-methods.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore Stripe Dynamic Payment Methods
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/create-signature-checkout/index.ts")
          source = path.read_text()
          old = '''      // INSTANT CARD PAYMENT — verified on a 393px phone: with dynamic
      // payment methods, live Checkout opened on Stripe Link's "verify your
      // phone number" wall, with card entry hidden behind "Pay without
      // Link". A guest reads that as "I cannot pay". Pinning card keeps the
      // card form as the first and only thing they see.
      payment_method_types: ["card"],
'''
          if old not in source:
              raise SystemExit("Expected card-only checkout block not found; refusing an unsafe blind edit")
          source = source.replace(old, "", 1)
          if 'payment_method_types: ["card"]' in source:
              raise SystemExit("Card-only payment method pin still present")
          path.write_text(source)

      - name: Commit minimal hotfix
        run: |
          git config user.name "YES Experiences CI"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/create-signature-checkout/index.ts
          git diff --cached --check
          git commit -m "Restore Stripe dynamic payment methods"
          git push origin HEAD:main
