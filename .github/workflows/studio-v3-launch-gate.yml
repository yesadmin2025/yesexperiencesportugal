name: studio-v3-launch-gate

on:
  pull_request:
    paths:
      - "src/components/studio-v3/**"
      - "src/routes/studio-v3*"
      - "e2e/studio-v3-*"
      - ".github/workflows/studio-v3-launch-gate.yml"
  workflow_dispatch:

jobs:
  unit:
    name: unit + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      - run: bunx tsgo --noEmit

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Run studio-v3 e2e (mobile + WebKit)
        run: |
          bunx playwright test \
            --grep "studio-v3" \
            --project=mobile-chromium --project=mobile-webkit \
            --shard=${{ matrix.shard }}/4 \
            --reporter=line,html
      - name: Upload traces + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v3-e2e-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  lighthouse:
    name: lighthouse mobile
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Serve + Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.14.x autorun \
            --config=./.lighthouserc.mobile.json \
            --collect.url=http://localhost:8080/studio-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  gate:
    name: launch-gate
    runs-on: ubuntu-latest
    needs: [unit, e2e, lighthouse]
    steps:
      - run: echo "All Studio V3 launch checks passed."
