name: Living Atlas format artifact

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format exact files
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasPreviewPrimitives.tsx
          src/components/studio-v3/LivingAtlasResultStep.tsx
          src/components/studio-v3/LivingAtlasShapeStep.tsx
          src/components/studio-v3/livingAtlasAlternatives.ts
          src/components/studio-v3/livingAtlasPreviewState.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-formatted-sources
          path: |
            src/components/studio-v3/LivingAtlasPreviewPrimitives.tsx
            src/components/studio-v3/LivingAtlasResultStep.tsx
            src/components/studio-v3/LivingAtlasShapeStep.tsx
            src/components/studio-v3/livingAtlasAlternatives.ts
            src/components/studio-v3/livingAtlasPreviewState.ts
            src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          if-no-files-found: error
          retention-days: 3
