name: Full-site Lighthouse audit

on:
  push:
    branches:
      - audit/full-site-20261002

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start preview
        run: |
          bun run preview --port 4175 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Audit slow commercial pages
        run: |
          mkdir -p /tmp/lh
          for path in about contact portugal-travel-designer proposal-in-portugal corporate experiences studio; do
            echo "=== /$path ==="
            bunx lighthouse "http://localhost:4175/$path" \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox" \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=393 \
              --screenEmulation.height=851 \
              --screenEmulation.deviceScaleFactor=2.75 \
              --throttling-method=simulate \
              --only-categories=performance,accessibility,best-practices \
              --output=json \
              --output-path="/tmp/lh/$path.json"
            node -e '
              const f=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              const a=f.audits,c=f.categories;
              const pick=(id)=>a[id]?{score:a[id].score,value:a[id].displayValue,numeric:a[id].numericValue}:null;
              console.log(JSON.stringify({
                performance:Math.round(c.performance.score*100),
                accessibility:Math.round(c.accessibility.score*100),
                bestPractices:Math.round(c["best-practices"].score*100),
                FCP:pick("first-contentful-paint"),
                LCP:pick("largest-contentful-paint"),
                TBT:pick("total-blocking-time"),
                CLS:pick("cumulative-layout-shift"),
                SI:pick("speed-index"),
                unusedJS:pick("unused-javascript"),
                renderBlocking:pick("render-blocking-resources"),
                imageDelivery:pick("uses-optimized-images"),
                modernImages:pick("uses-webp-images"),
                responsiveImages:pick("uses-responsive-images"),
                mainthread:pick("mainthread-work-breakdown"),
                bootup:pick("bootup-time")
              }));' "/tmp/lh/$path.json"
          done
