name: Builder / Studio / Homepage suites

# Runs the vitest suites that lock the Builder, Studio (v3), and
# Homepage contracts on every pull request and on pushes to main.
# A single failing spec blocks the merge — the job `name:` below is
# the status-check context to register in branch protection.
#
# Why one workflow with three jobs instead of three workflows:
# - Each job has its own log/summary in the PR UI so a Builder
#   failure is not buried under Homepage output.
# - Jobs run in parallel on separate runners (faster signal).
# - Branch protection can require all three independently.

on:
  pull_request:
  push:
    branches: [main, p10-persistent-delegation]

permissions:
  contents: write

concurrency:
  group: builder-studio-homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder-suite:
    name: Builder suite — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Builder specs
        run: |
          bunx vitest run \
            src/__tests__/builder-images-pipeline.test.ts \
            src/__tests__/builder-step-advance.test.ts \
            src/components/builder \
            --reporter=verbose

  studio-suite:
    name: Studio (v3) suite — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Studio specs
        run: |
          bunx vitest run \
            src/components/studio-v3 \
            src/lib/drift \
            --reporter=verbose

  homepage-suite:
    name: Homepage suite — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Homepage specs
        run: |
          bunx vitest run \
            src/__tests__/homepage-contrast.test.ts \
            src/__tests__/homepage-typography-scale.test.ts \
            src/__tests__/typography-regression.test.ts \
            src/__tests__/brand-visual-regression.test.ts \
            src/__tests__/per-page-brand-regression.test.ts \
            src/__tests__/editorial-shadow-stack.test.ts \
            src/__tests__/cta-band-guardrail.test.ts \
            src/__tests__/faq-typography-lock.test.ts \
            src/__tests__/home-motion.test.ts \
            src/__tests__/animation-contract-regression.test.ts \
            src/__tests__/cta-band-guardrail.test.ts \
            src/__tests__/faq-typography-lock.test.ts \
            src/__tests__/home-motion.test.ts \
            src/__tests__/animation-contract-regression.test.ts \
            src/routes/__tests__/-homepage-structure.test.ts \
            src/content/hero-copy.test.ts \
            src/content/hero-copy.spec.ts \
            --reporter=verbose

  p10-persistence-hardening:
    name: P10 persistent delegation hardening
    if: ${{ github.ref == 'refs/heads/p10-persistent-delegation' && !contains(github.event.head_commit.message, '[p10-persist-code]') && !contains(github.event.head_commit.message, '[p10-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply strict persistence patch
        run: python3 .github/scripts/p10-persistence-patch.py
      - name: Scope gate
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/components/studio-v3/StudioV3.tsx
          src/components/studio-v3/__tests__/studio-p10-delegation.test.ts
          src/components/studio-v3/studioDelegation.ts"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused P7-P10 truth tests
        run: |
          bunx vitest run \
            src/components/studio-v3/__tests__/studio-p10-delegation.test.ts \
            src/components/studio-v3/__tests__/studio-p8-route-truth.test.ts \
            src/components/studio-v3/__tests__/studio-p9-price-after-value.test.ts \
            src/components/studio-v3/__tests__/studio-p7-directors-read.test.tsx \
            --reporter=verbose
      - name: Full Studio V3 and Studio lib suite
        run: bunx vitest run src/components/studio-v3 src/lib/studio-v3 --reporter=dot
      - name: TypeScript no-emit
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated product patch to isolated branch
        run: |
          git config user.name "p10-persistence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/studio-v3/StudioV3.tsx \
                  src/components/studio-v3/studioDelegation.ts \
                  src/components/studio-v3/__tests__/studio-p10-delegation.test.ts
          git commit -m "Persist P10 delegation across back-edits [p10-persist-code]"
          git push origin HEAD:p10-persistent-delegation
