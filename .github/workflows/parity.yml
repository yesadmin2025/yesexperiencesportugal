name: SoT ↔ Viator parity

on:
  push:
    branches: [main]
    paths:
      - "src/data/signatureToursSourceOfTruth.ts"
      - "src/data/signatureToursViator.ts"
      - "src/data/signatureTours.ts"
      - "src/lib/tourContent.ts"
      - "src/__tests__/**"
      - ".github/workflows/parity.yml"
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:00 UTC (05:00 Lisbon in winter, 05:00 WEST in summer)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run SoT ↔ Viator parity tests
        run: bunx vitest run src/__tests__/sot-viator-parity.test.ts src/__tests__/viator-url-parity.test.ts
