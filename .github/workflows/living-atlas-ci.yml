name: Living Atlas validation

on:
  push:
    branches:
      - studio/living-atlas
    paths:
      - "src/components/studio-v3/LivingAtlasPreview.tsx"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - ".github/workflows/living-atlas-ci.yml"
  pull_request:
    paths:
      - "src/components/studio-v3/LivingAtlasPreview.tsx"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - ".github/workflows/living-atlas-ci.yml"

permissions:
  contents: write

concurrency:
  group: living-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Taxonomy, decision, inventory, composer and preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'studio/living-atlas' || github.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Produce formatted Living Atlas files
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlasPreview.tsx
          src/components/studio-v3/livingAtlas*.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.tsx
          src/routes/studio-living-atlas-preview.tsx

      - name: Commit validated formatting
        if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Living Atlas files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/studio-v3/LivingAtlasPreview.tsx \
            src/components/studio-v3/livingAtlas*.ts \
            src/components/studio-v3/__tests__/living-atlas-*.test.ts \
            src/components/studio-v3/__tests__/living-atlas-*.test.tsx \
            src/routes/studio-living-atlas-preview.tsx
          git commit -m "style(studio): format validated Living Atlas files"
          git push origin HEAD:studio/living-atlas

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-formatted
          path: |
            src/components/studio-v3/LivingAtlasPreview.tsx
            src/components/studio-v3/livingAtlas*.ts
            src/components/studio-v3/__tests__/living-atlas-*.test.ts
            src/components/studio-v3/__tests__/living-atlas-*.test.tsx
            src/routes/studio-living-atlas-preview.tsx
          if-no-files-found: error
          retention-days: 3
