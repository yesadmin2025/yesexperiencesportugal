name: Living Atlas validation

on:
  push:
    branches:
      - studio/living-atlas
      - living-atlas-production-promotion
    paths:
      - "src/components/studio-v3/LivingAtlas*.tsx"
      - "src/components/studio-v3/StudioExperiencePage.tsx"
      - "src/components/studio-v3/MapAwakens.tsx"
      - "src/components/studio-v3/dateGuards.ts"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - ".github/workflows/living-atlas-ci.yml"
  pull_request:
    paths:
      - "src/components/studio-v3/LivingAtlas*.tsx"
      - "src/components/studio-v3/StudioExperiencePage.tsx"
      - "src/components/studio-v3/MapAwakens.tsx"
      - "src/components/studio-v3/dateGuards.ts"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - ".github/workflows/living-atlas-ci.yml"

permissions:
  contents: read

concurrency:
  group: living-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Living Atlas product layer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Living Atlas formatting
        run: |
          FILES="src/components/studio-v3/LivingAtlas*.tsx src/components/studio-v3/StudioExperiencePage.tsx src/components/studio-v3/MapAwakens.tsx src/components/studio-v3/dateGuards.ts src/components/studio-v3/livingAtlas*.ts src/components/studio-v3/__tests__/living-atlas-*.test.ts src/components/studio-v3/__tests__/living-atlas-*.test.tsx src/routes/studio-living-atlas-preview.tsx"
          if ! bunx prettier --check $FILES; then
            bunx prettier --write $FILES
            git diff -- $FILES
            exit 1
          fi

      - name: Lint Living Atlas production surface
        run: >-
          bunx eslint
          src/components/studio-v3/LivingAtlasBookingStep.tsx
          src/components/studio-v3/LivingAtlasJourneyPreview.tsx
          src/components/studio-v3/StudioExperiencePage.tsx
          src/routes/studio-living-atlas-preview.tsx

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/__tests__/living-atlas-route-planner.test.ts
          src/components/studio-v3/__tests__/living-atlas-schedule.test.ts
          src/components/studio-v3/__tests__/living-atlas-operational-confidence.test.ts
          src/components/studio-v3/__tests__/living-atlas-date-rules.test.ts
          src/components/studio-v3/__tests__/living-atlas-public-copy.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-checkout-handoff.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx
          src/components/studio-v3/__tests__/living-atlas-production-contract.test.ts

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Build production bundle
        run: bun run build
