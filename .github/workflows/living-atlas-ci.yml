name: Living Atlas validation

on:
  push:
    branches:
      - studio/living-atlas
    paths:
      - "src/components/studio-v3/LivingAtlas*.tsx"
      - "src/components/studio-v3/MapAwakens.tsx"
      - "src/components/studio-v3/dateGuards.ts"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - "scripts/close-living-atlas-checkout.mjs"
      - ".github/workflows/living-atlas-ci.yml"
  pull_request:
    paths:
      - "src/components/studio-v3/LivingAtlas*.tsx"
      - "src/components/studio-v3/MapAwakens.tsx"
      - "src/components/studio-v3/dateGuards.ts"
      - "src/components/studio-v3/livingAtlas*.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.ts"
      - "src/components/studio-v3/__tests__/living-atlas-*.test.tsx"
      - "src/routes/studio-living-atlas-preview.tsx"
      - "scripts/close-living-atlas-checkout.mjs"
      - ".github/workflows/living-atlas-ci.yml"

permissions:
  contents: write

concurrency:
  group: living-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Living Atlas product layer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Detect completed handoff
        id: handoff
        run: |
          if grep -q 'readonly fixedTourDate?: string' src/components/studio-v3/GuestDetailsStep.tsx; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.handoff.outputs.complete != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.handoff.outputs.complete != 'true'
        run: bun install --frozen-lockfile

      - name: Apply final checkout handoff
        if: steps.handoff.outputs.complete != 'true'
        run: node scripts/close-living-atlas-checkout.mjs

      - name: Format product files
        if: steps.handoff.outputs.complete != 'true'
        run: >-
          bunx prettier --write
          src/components/studio-v3/GuestDetailsStep.tsx
          src/components/studio-v3/LivingAtlasJourneyPreview.tsx
          src/components/studio-v3/LivingAtlasBookingStep.tsx
          src/components/studio-v3/livingAtlasCheckoutHandoff.ts
          src/components/studio-v3/__tests__/living-atlas-checkout-handoff.test.ts

      - name: Run Living Atlas tests
        if: steps.handoff.outputs.complete != 'true'
        run: bunx vitest run src/components/studio-v3/__tests__/living-atlas-*.test.ts src/components/studio-v3/__tests__/living-atlas-*.test.tsx

      - name: Typecheck project
        if: steps.handoff.outputs.complete != 'true'
        run: bunx tsc --noEmit

      - name: Lint changed product files
        if: steps.handoff.outputs.complete != 'true'
        run: >-
          bunx eslint
          src/components/studio-v3/GuestDetailsStep.tsx
          src/components/studio-v3/LivingAtlasJourneyPreview.tsx
          src/components/studio-v3/LivingAtlasBookingStep.tsx
          src/components/studio-v3/livingAtlasCheckoutHandoff.ts
          src/components/studio-v3/__tests__/living-atlas-checkout-handoff.test.ts

      - name: Guard exact product paths
        if: steps.handoff.outputs.complete != 'true'
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          allowed="$(printf '%s\n' \
            src/components/studio-v3/GuestDetailsStep.tsx \
            src/components/studio-v3/LivingAtlasBookingStep.tsx \
            src/components/studio-v3/LivingAtlasJourneyPreview.tsx \
            src/components/studio-v3/__tests__/living-atlas-checkout-handoff.test.ts \
            src/components/studio-v3/livingAtlasCheckoutHandoff.ts | sort)"
          test "$changed" = "$allowed"

      - name: Commit validated handoff
        if: steps.handoff.outputs.complete != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/studio-v3/GuestDetailsStep.tsx \
            src/components/studio-v3/LivingAtlasBookingStep.tsx \
            src/components/studio-v3/LivingAtlasJourneyPreview.tsx \
            src/components/studio-v3/__tests__/living-atlas-checkout-handoff.test.ts \
            src/components/studio-v3/livingAtlasCheckoutHandoff.ts
          git commit -m "feat(studio): close Living Atlas sandbox checkout loop"
          git push origin HEAD:studio/living-atlas
