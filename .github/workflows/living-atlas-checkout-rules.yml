name: Living Atlas checkout rules

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-checkout-rules.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply checkout rules
        run: node scripts/apply-living-atlas-checkout-rules.mjs

      - name: Format changed files
        run: >-
          bunx prettier --write
          src/components/studio-v3/GuestDetailsStep.tsx
          supabase/functions/create-signature-checkout/index.ts
          supabase/functions/_shared/studio-booking-date.ts

      - name: Run Living Atlas product tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-date-rules.test.ts
          src/components/studio-v3/__tests__/living-atlas-schedule.test.ts
          src/components/studio-v3/__tests__/living-atlas-public-copy.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Typecheck project
        run: bunx tsc --noEmit

      - name: Guard exact changed paths
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/components/studio-v3/GuestDetailsStep.tsx' \
            'supabase/functions/create-signature-checkout/index.ts' | sort)"
          test "$changed" = "$expected"

      - name: Commit validated checkout integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/studio-v3/GuestDetailsStep.tsx \
            supabase/functions/create-signature-checkout/index.ts
          git commit -m "feat(studio): validate booking date and preserve optional preferences"
          git push origin HEAD:studio/living-atlas
