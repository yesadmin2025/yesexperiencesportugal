name: Signature Map & Image Integrity

# Guards every Signature tour page against two silent regressions:
#   1. Route map failing to render (missing stops, broken lazy import,
#      Leaflet crash) — the map's `[role="img"]` tile must be present
#      with non-zero size on every tour id.
#   2. Broken images — any `<img>` that fails to load (naturalWidth 0)
#      or any image response with HTTP >= 400 fails the job.
#
# Runs the dedicated Playwright spec: `e2e/signature-map-and-images.spec.ts`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: signature-map-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signature-map-images:
    name: Playwright — signature map + image integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lockb') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium + system deps
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Run signature map + image integrity suite
        run: bun run test:e2e:signature-map-and-images
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-map-images-playwright-report
          path: playwright-report/
          retention-days: 14
