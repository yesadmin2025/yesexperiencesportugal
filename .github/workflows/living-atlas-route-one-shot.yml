name: Living Atlas route one-shot

on:
  pull_request:
    paths:
      - ".github/workflows/living-atlas-route-one-shot.yml"

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: studio/living-atlas
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Widen testable routing limit types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/studio-v3/livingAtlasRoutePlanner.ts')
          text = path.read_text()
          old = 'limits?: Partial<typeof LIVING_ATLAS_PREVIEW_ROUTING_LIMITS>;'
          new = 'limits?: Partial<Record<keyof typeof LIVING_ATLAS_PREVIEW_ROUTING_LIMITS, number>>;'
          if old not in text:
              raise SystemExit('routing limit type anchor not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Format Living Atlas sources
        run: >-
          bunx prettier --write
          src/components/studio-v3/LivingAtlas*.tsx
          src/components/studio-v3/MapAwakens.tsx
          src/components/studio-v3/livingAtlas*.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.ts
          src/components/studio-v3/__tests__/living-atlas-*.test.tsx
          src/routes/studio-living-atlas-preview.tsx

      - name: Run Living Atlas tests
        run: >-
          bunx vitest run
          src/components/studio-v3/__tests__/living-atlas-taxonomy.test.ts
          src/components/studio-v3/__tests__/living-atlas-decision.test.ts
          src/components/studio-v3/__tests__/living-atlas-inventory.test.ts
          src/components/studio-v3/__tests__/living-atlas-composer.test.ts
          src/components/studio-v3/__tests__/living-atlas-alternatives.test.ts
          src/components/studio-v3/__tests__/living-atlas-route-planner.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-composition.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview-state.test.ts
          src/components/studio-v3/__tests__/living-atlas-preview.test.tsx

      - name: Validate TypeScript
        run: bunx tsc --noEmit

      - name: Guard changed paths
        run: |
          while IFS= read -r path; do
            case "$path" in
              src/components/studio-v3/LivingAtlas*.tsx|src/components/studio-v3/MapAwakens.tsx|src/components/studio-v3/livingAtlas*.ts|src/components/studio-v3/__tests__/living-atlas-*.test.ts|src/components/studio-v3/__tests__/living-atlas-*.test.tsx|src/routes/studio-living-atlas-preview.tsx) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only)

      - name: Commit validated route layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3 src/routes/studio-living-atlas-preview.tsx
          git commit -m "style(studio): validate and format geographic route layer"
          git push origin HEAD:studio/living-atlas
