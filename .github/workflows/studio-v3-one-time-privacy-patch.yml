name: Studio V3 one-time privacy patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/studio-v3-privacy-trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'studio-v3-pii-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-v3-pii-patch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Keep personal data out of Studio session storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/studio-v3/StudioV3.tsx")
          text = path.read_text()
          old = '''    window.sessionStorage.setItem(STUDIO_V3_SESSION_KEY, JSON.stringify(state));'''
          new = '''    // Persist composition only. Guest identity, contact details, pickup address
    // and guide notes remain in React state for the current visit but never
    // enter sessionStorage.
    const safeState: StudioV3State = {
      ...state,
      firstName: null,
      guestDraft: null,
    };
    window.sessionStorage.setItem(STUDIO_V3_SESSION_KEY, JSON.stringify(safeState));'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif "JSON.stringify(safeState)" not in text:
              raise SystemExit("Expected Studio session write was not found")
          PY
      - name: Format and verify
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/components/studio-v3/StudioV3.tsx
          bunx tsc --noEmit -p tsconfig.json
      - name: Remove temporary patch machinery and commit
        run: |
          rm -f .github/studio-v3-privacy-trigger
          rm -f .github/workflows/apply-studio-session-pii-once.yml
          rm -f .github/workflows/studio-v3-one-time-privacy-patch.yml
          git config user.name "Studio V3 privacy gate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep personal data out of Studio session storage"
          git push origin studio-v3-pii-patch
