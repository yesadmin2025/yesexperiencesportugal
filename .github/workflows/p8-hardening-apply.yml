name: P8 hardening apply

on:
  push:
    branches: [p8-unified-your-day]
    paths:
      - .github/p8-hardening-run.trigger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate patch runner
        run: python -m py_compile .github/p8-hardening-patch.py

      - name: Apply P8 hardening patch
        run: python .github/p8-hardening-patch.py

      - name: Focused P8 and route-truth tests
        run: |
          bunx vitest run \
            src/components/studio-v3/__tests__/studio-p8-route-truth.test.tsx \
            src/components/studio-v3/__tests__/studio-p8-unified-your-day.test.ts \
            src/components/studio-v3/__tests__/curation-operational.test.ts \
            src/components/studio-v3/__tests__/route-containment.test.ts \
            src/components/studio-v3/__tests__/studio-p7-directors-read.test.tsx \
            src/components/studio-v3/__tests__/studio-p6-acknowledge-once.test.ts \
            src/components/studio-v3/__tests__/studio-p5-inherited-intent.test.ts

      - name: Full Studio V3 unit suite
        run: bunx vitest run src/components/studio-v3 src/lib/studio-v3

      - name: TypeScript noEmit
        run: bunx tsgo --noEmit

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3 src/generated/brand-audit.json
          if git diff --cached --quiet; then
            echo "No validated code changes to commit"
            exit 1
          fi
          git commit -m "P8 hardening: preserve personalized route truth"
          git push origin HEAD:p8-unified-your-day
