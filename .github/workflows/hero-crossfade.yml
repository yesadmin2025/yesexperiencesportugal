name: Hero Cross-Fade Playwright

# Runs the Playwright hero chapter cross-fade + timeline specs on every
# push and pull request. These specs verify:
#   - e2e/hero-chapter-crossfade.spec.ts — both outgoing and incoming
#     chapter overlays render simultaneously with eased opacities
#     summing to ~1 during the 600ms cosine cross-fade.
#   - e2e/hero-chapter-timeline.spec.ts — the active chapter overlay
#     matches the video's currentTime across the full timeline (mid-
#     chapter snapshots + 0.5s invariant sweep).
on:
  pull_request:
  push:
  workflow_dispatch:

# Cancel in-flight runs for the same ref when new commits arrive.
concurrency:
  group: hero-crossfade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-hero-codec:
    # Trusted in-repository PR #69 only; never execute PR-controlled code with write token.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/quality-gates-studio-hero-lighthouse-20261121' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install ffmpeg and ffprobe in minimal runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Repair the two original film assets once, preserving the full 27s edit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          declare -A originals=(
            [720]="3c1915712e18bb4b3c3d3ad4b919b5bcd9ad26b7"
            [1080]="d6ef4f411a3c232cdd9d33f9b5fc9c0f13017eba"
          )
          updated=0
          for variant in 720 1080; do
            source="public/video/hero-sunset-road-27s-${variant}.mp4"
            current="$(git hash-object "${source}")"
            echo "${source}: current blob ${current}"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,r_frame_rate -of default=noprint_wrappers=1 "${source}"
            if [[ "${current}" != "${originals[$variant]}" ]]; then
              echo "This media is no longer the original master; not rewriting it."
              continue
            fi
            out="public/video/.normalized-hero-${variant}.mp4"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "${source}" \
              -map 0:v:0 -an -c:v libx264 -preset medium -crf 20 \
              -pix_fmt yuv420p -r 30 -movflags +faststart "${out}"
            codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "${out}")"
            pix="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "${out}")"
            fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "${out}")"
            if [[ "${codec}" != "h264" || "${pix}" != "yuv420p" || "${fps}" != "30/1" ]]; then
              echo "::error::H264 validation failed for ${source} (${codec}/${pix}/${fps})"
              exit 1
            fi
            mv "${out}" "${source}"
            updated=1
          done
          if [[ "${updated}" == "1" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/video/hero-sunset-road-27s-{720,1080}.mp4
            git commit -m "fix(media): normalize continuous YES hero film to H264 for browser playback"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
  crossfade:
    name: Hero cross-fade (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lockb') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium + system deps
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Install Google Chrome for H.264 film playback tests
        run: bunx playwright install --with-deps chrome

      - name: Run current hero reveal and CTA specs (Chromium)
        run: bunx playwright test e2e/hero-v4-reveal.spec.ts e2e/hero-cro-mobile.spec.ts --project=mobile-chromium --project=desktop-chromium
        env:
          CI: "true"

      - name: Run film playback and first-frame budgets (Google Chrome)
        run: bunx playwright test e2e/hero-film-playback.spec.ts --config=playwright.hero-film.config.ts
        env:
          CI: "true"

      - name: Upload Playwright report (diffs + traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-crossfade-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failed snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hero-crossfade-snapshot-diffs
          path: test-results/
          retention-days: 14
