name: format-checkout-recovery

on:
  push:
    branches:
      - checkout-confirmation-recovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkout-confirmation-recovery
          fetch-depth: 0
      - name: Format only the checkout recovery toast
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/studio-v3/StudioV3.tsx")
          source = path.read_text()
          old = '        toast.error("Secure checkout couldn\'t open. Your details and selections are still here — try again.");'
          new = '''        toast.error(
          "Secure checkout couldn't open. Your details and selections are still here — try again.",
        );'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exact checkout toast once, found {count}")
          path.write_text(source.replace(old, new, 1))
      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/components/studio-v3/StudioV3.tsx
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/components/studio-v3/StudioV3.tsx"
      - name: Commit format fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio-v3/StudioV3.tsx
          git commit -m "Format checkout recovery toast"
          git push origin HEAD:checkout-confirmation-recovery
