name: checkout-surfaces-smoke

# Required check: every push and PR must prove Signature, Tailored, and
# Builder (Studio v3) checkout surfaces render without error copy on both
# mobile and desktop viewports.

on:
  push:
  pull_request:

concurrency:
  group: checkout-surfaces-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Signature + Tailored + Builder × mobile + desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run checkout surfaces smoke
        run: |
          bunx playwright test e2e/checkout-surfaces-smoke.spec.ts \
            --project=mobile-chromium \
            --project=desktop-chromium \
            --reporter=list

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-surfaces-traces
          path: |
            test-results/**
            playwright-report/**
          retention-days: 7
